<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>find your dream home!</title>
  </head>
  <body>
    <div id="header-placeholder"></div>
    <div id="hero-placeholder"></div>
    <div id="search-placeholder"></div>
    <div id="Section1-placeholder"></div>
    <div id="Section2-placeholder"></div>
    <div id="Section3-placeholder"></div>
    <div id="Section4-placeholder"></div>
    <div id="Section5-placeholder"></div>
    <div id="footer-placeholder"></div>
    <script>
      const loadSection = (id, file) => {
        fetch(file)
          .then((response) => response.text())
          .then((html) => {
            document.getElementById(id).innerHTML = html;
          });
      };

      loadSection("header-placeholder", "header.html");
      loadSection("hero-placeholder", "hero.html");
      loadSection("search-placeholder", "search.html");
      loadSection("Section1-placeholder", "section1.html");
      loadSection("Section2-placeholder", "section2.html");
      loadSection("Section3-placeholder", "section3.html");
      loadSection("Section4-placeholder", "section4.html");
      loadSection("Section5-placeholder", "section5.html");
      loadSection("footer-placeholder", "footer.html");
    </script>
  </body>
</html>
