<section aria-label="Property search" class="bg-[#fef7f2] pb-12">
  <div class="mx-auto max-w-5xl px-4">
    <form
      class="grid gap-4 rounded-3xl bg-[#ddc7bb] p-5 shadow md:grid-cols-2 lg:grid-cols-4"
    >
      <label class="block">
        <span class="sr-only">Location</span>
        <input
          type="text"
          name="location"
          placeholder="Location"
          class="w-full rounded-xl bg-white px-4 py-3 outline-none"
        />
      </label>

      <label class="block">
        <span class="sr-only">Property type</span>
        <input
          type="text"
          name="type"
          placeholder="Type"
          class="w-full rounded-xl bg-white px-4 py-3 outline-none"
        />
      </label>

      <label class="block">
        <span class="sr-only">Price range</span>
        <input
          type="text"
          name="price"
          placeholder="Price Range"
          class="w-full rounded-xl bg-white px-4 py-3 outline-none"
        />
      </label>

      <button
        type="submit"
        class="rounded-xl bg-[#2b1b12] px-4 py-3 font-medium text-white"
      >
        Sign up
      </button>
    </form>
  </div>
</section>
