<section id="support" class="mx-auto max-w-7xl px-4 py-20 text-center">
  <header>
    <h2 class="text-4xl font-bold leading-tight">
      Do You Have Any Questions?<br />
      Get Help From Us
    </h2>
  </header>

  <div
    class="mt-8 flex flex-col items-center justify-center gap-4 md:flex-row md:gap-10"
  >
    <a href="#" class="hover:underline">Chat live with our support team</a>
    <a href="#" class="hover:underline">Browse our FAQ</a>
  </div>

  <form class="mx-auto mt-10 flex max-w-2xl flex-col gap-4 md:flex-row">
    <label class="block flex-1">
      <span class="sr-only">Email address</span>
      <input
        type="email"
        name="email"
        placeholder="Enter your email address..."
        class="w-full rounded-xl bg-[#ddc7bb] px-4 py-4 outline-none"
      />
    </label>

    <button
      type="submit"
      class="rounded-xl bg-[#2b1b12] px-8 py-4 font-medium text-white"
    >
      Submit
    </button>
  </form>
</section>
